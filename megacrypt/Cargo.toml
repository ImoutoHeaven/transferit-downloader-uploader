[package]
name = "megacrypt"
version = "0.1.0"
edition = "2021"
description = "MEGA/transfer.it file encryption (AES-CTR + chunk MACs) as a native Python extension"

[lib]
name = "megacrypt"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
aes = "0.8"
ctr = "0.9"
